
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MY Diners - Orders</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <img src="logo.png" alt="MY Diners Logo" class="logo">
        <h1>MY Diners</h1>
        <p>Smart Order Fulfilment System</p>
    </header>

    <nav aria-label="Main navigation">
        <a href="index.html">Orders</a>
        <a href="kitchen.html">Kitchen</a>
        <a href="manager.html">Manager</a>
    </nav>

    <main>

        <section>
            <h2>New Customer Order</h2>
            <p>Enter the customer order information below.</p>

            <form action="/add_order" method="POST">

                <label for="orderNumber">Order Number:</label>
                <input
                    type="number"
                    id="orderNumber"
                    name="orderNumber"
                    min="1"
                    required
                    title="Please enter a positive order number">

                <label for="orderType">Order Type:</label>
                <select id="orderType" name="orderType" required>
                    <option value="">Select order type</option>
                    <option value="Walk-in">Walk-in</option>
                    <option value="Takeaway">Takeaway</option>
                    <option value="Delivery">Delivery</option>
                </select>

                <label for="foodItem">Food Item:</label>
                <select id="foodItem" name="foodItem" required>
                    <option value="">Select a food item</option>
                    <option value="Chicken Curry">Chicken Curry</option>
                    <option value="Grilled Chicken">Grilled Chicken</option>
                    <option value="Biryani">Biryani</option>
                </select>

                <button type="submit">Add Order</button>

            </form>

            <p class="help-text">
                All fields are required. Order numbers must be positive.
            </p>

        </section>

    </main>

    <footer>
        <p>Group 11 - MY Diners</p>
    </footer>

</body>
</html>
